    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a9682"/>
      <stop offset="1" stop-color="#2f7563"/>
    </linearGradient>
    <pattern id="vichy" width="44" height="44" patternUnits="userSpaceOnUse">
