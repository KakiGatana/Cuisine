      <rect width="22" height="44" fill="#e2483a" opacity=".38"/>
      <rect width="44" height="22" fill="#e2483a" opacity=".38"/>
    </pattern>
    <clipPath id="round"><rect width="512" height="512" rx="114"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="236" r="200" fill="#fff" opacity=".09"/>
